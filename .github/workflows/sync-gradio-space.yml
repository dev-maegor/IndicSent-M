name: Sync Gradio Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: ${{ vars.HF_SPACE_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and Git LFS files
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Add Hugging Face Space metadata
        run: |
          {
            printf '%s\n' '---' 'title: IndicSent-M' 'colorFrom: green' 'colorTo: blue' 'sdk: gradio' 'app_file: app.py' 'python_version: "3.11"' '---' ''
            cat README.md
          } > README.space.md
          mv README.space.md README.md
      - name: Sync to Hugging Face Space
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ vars.HF_SPACE_ID }}
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: gradio
